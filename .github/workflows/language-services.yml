name: Real Java and Python providers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/language.js'
      - 'src/providers/**'
      - 'test/host/languages.js'
      - '.github/workflows/language-services.yml'

permissions:
  contents: read

jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [java, python]
    env:
      SOURCEINSIGHT_READER_LANGUAGE: ${{ matrix.language }}
      SOURCEINSIGHT_READER_DOWNLOAD_VSCODE: '1'
      SOURCEINSIGHT_READER_VSCODE_VERSION: stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libgbm1 libnss3 libasound2t64
      - run: npm ci
      - run: npm run test:host -- --headless
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-${{ matrix.language }}
          path: dist/host-${{ matrix.language }}-results.json
          if-no-files-found: error
